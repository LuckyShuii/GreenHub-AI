name: AI CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

# Une nouvelle poussée sur une PR annule le run précédent encore en cours.
concurrency:
  group: ai-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: lucasboillot/greenhub
  DEPLOY_SERVICE: ai

jobs:
  quality:
    name: Qualité
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Linter
        run: uv run ruff check .

      - name: Tests
        env:
          CI: "true"
        run: uv run pytest

  docker:
    name: Build & push Docker
    runs-on: ubuntu-latest
    needs: quality

    permissions:
      contents: read

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract commit SHA
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:ai-${{ steps.vars.outputs.SHA_SHORT }}
            ${{ env.IMAGE_NAME }}:ai-latest

  deploy:
    name: Déclencher le déploiement VPS
    runs-on: ubuntu-latest
    needs: docker

    permissions: {}

    steps:
      - name: Déclencher le déploiement
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            --request POST \
            --header "X-Deploy-Token: ${VPS_DEPLOY_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"version\":\"latest\"}" \
            "https://${DEPLOY_HOST}/hooks/deploy-${DEPLOY_SERVICE}"
