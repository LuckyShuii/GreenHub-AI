
services:

  web:
    build: .
    env_file:
      - path: .env
        required: True
    environment:
      - WEB_HOST=${AI_HOST}
      - WEB_PORT=${AI_PORT}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=${QDRANT_PORT}
      - QDRANT_GRPC_PORT=${QDRANT_GRPC_PORT}
    ports:
      - "${AI_PORT}:${AI_PORT}"
    volumes:
      - ./image_dir:/greener/image_dir
      - ./models:/greener/models
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    build:
      context: .
      dockerfile: qdrant.dockerfile
      args:
        QDRANT_VERSION: ${QDRANT_VERSION}
    env_file:
      - path: .env
        required: True
    environment:
      - QDRANT__SERVICE__HOST=${QDRANT_HOST}
      - QDRANT__SERVICE__HTTP_PORT=${QDRANT_PORT}
      - QDRANT__SERVICE__GRPC_PORT=${QDRANT_GRPC_PORT}
      - QDRANT__LOG_LEVEL=${QDRANT_LOG_LEVEL}
    ports:
      - "${QDRANT_PORT}:${QDRANT_PORT}"
      - "${QDRANT_GRPC_PORT}:${QDRANT_GRPC_PORT}"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  backup_images:
  models:
 
