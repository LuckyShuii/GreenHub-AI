
services:

  web:
    build: .
    env_file:
      - path: .env
        required: True
    environment:
      - WEB_HOST=${AI_HOST}
      - WEB_PORT=${AI_PORT}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=${QDRANT_PORT}
      - QDRANT_GRPC_PORT=${QDRANT_GRPC_PORT}
    ports:
      - "${AI_PORT}:${AI_PORT}"
    volumes:
      - ./image_dir:/greener/image_dir:ro
      - ./models:/greener/models:ro
      # Optional, git-ignored test UI served at /greener/ when index.html exists.
      - ./test_ui:/greener/test_ui:ro
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    build:
      context: .
      dockerfile: qdrant.dockerfile
      args:
        QDRANT_VERSION: ${QDRANT_VERSION}
    env_file:
      - path: .env
        required: True
    environment:
      - QDRANT__SERVICE__HOST=${QDRANT_HOST}
      - QDRANT__SERVICE__HTTP_PORT=${QDRANT_PORT}
      - QDRANT__SERVICE__GRPC_PORT=${QDRANT_GRPC_PORT}
      - QDRANT__LOG_LEVEL=${QDRANT_LOG_LEVEL}
    ports:
      # Bound to localhost only: Qdrant has no auth, and Docker bypasses UFW.
      # The web service reaches it through the internal Docker network.
      - "127.0.0.1:${QDRANT_PORT}:${QDRANT_PORT}"
      - "127.0.0.1:${QDRANT_GRPC_PORT}:${QDRANT_GRPC_PORT}"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  backup_images:
  models:
 
